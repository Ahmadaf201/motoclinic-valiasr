services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motoclinic}
      POSTGRES_USER: ${POSTGRES_USER:-motoclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motoclinic_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/api:/app
      - ./packages/core:/core
    environment:
      DATABASE_URL: postgresql://motoclinic:motoclinic_dev@db:5432/motoclinic
      API_PORT: 4000
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    depends_on:
      - db

  web:
    image: nginx:alpine
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
